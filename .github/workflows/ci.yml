name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - run: just check

      - run: just dbg
